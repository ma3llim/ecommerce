spring:
  application:
    name: ecommerce-application

  datasource:
    url: ${PG_URL}
    username: ${PG_USER}
    password: ${PG_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  cors:
    allowed-origins:
      - http://localhost:5173

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}

  cookie:
    access-token-name: access_token
    refresh-token-name: refresh_token
    secure: ${COOKIE_SECURE}
    http-only: true
    same-site: ${COOKIE_SAME_SITE}
    path: /